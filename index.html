<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COVID-19 Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <div class="card">

            <h1>🦠 COVID-19 Tracker</h1>
            <p class="subtitle">Track confirmed cases around the world</p>
           

            <div class="dropdown">
                <img src="https://flagsapi.com/PK/flat/64.png">
                <div class="selectcountry">
                <select name="country" id="">
                    

                </select>
                </div>

            </div>
            <div class="searchbtn">
            <button>Search</button>
            </div>
            

            <div class="country-info">
                <h2 class="info">Pakistan</h2>
                <p>Last Updated: 31 May 2026</p>
            </div>

            <div class="stats">

                <div class="stat-card cases">
                    <h3>Confirmed Cases</h3>
                    <p class="confirm">1,580,000</p>
                </div>

                <div class="stat-card recovered">
                    <h3>Recovered</h3>
                    <p class="recover">1,500,000</p>
                </div>

                <div class="stat-card deaths">
                    <h3>Deaths</h3>
                    <p class="death">30,000</p>
                </div>

            </div>

        </div>

    </div>
    <script src="codes.js"></script>
    <script src="app.js"></script>
    

</body>
</html>
